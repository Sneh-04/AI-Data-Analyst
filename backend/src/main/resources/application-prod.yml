server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
ml:
  service:
    base-url: ${ML_SERVICE_BASE_URL}

jwt:
  secret: ${JWT_SECRET}

storage:
  local-path: ${STORAGE_LOCAL_PATH}

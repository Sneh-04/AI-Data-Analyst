server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
ml:
  service:
    base-url: ${ML_SERVICE_BASE_URL}

jwt:
  secret: ${JWT_SECRET}

storage:
  local-path: ${STORAGE_LOCAL_PATH}

research:
  summary:
    path: ${RESEARCH_SUMMARY_PATH:classpath:research/v4_summary.json}
    expected-sha256: ${RESEARCH_SUMMARY_SHA256:58b2f46f6136beb404a7f7e8f17df49a0c9f062ff344d0fdf56360d970b72a32}

server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:25MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

ml:
  service:
    base-url: http://localhost:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 90000

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 2592000000 # 30 days — long-lived since it's revocable server-side (see refresh_tokens table)

storage:
  local-path: /tmp/ai-data-analyst/uploads
